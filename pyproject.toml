[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-claim-audit"
version = "0.1.0"
description = "Offline static auditing of documented execution-safety promises"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "security-claim-audit contributors"}]
dependencies = []

[project.scripts]
security-claim-audit = "security_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
